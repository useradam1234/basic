<!DOCTYPE html>
<!-- ============================================================================
     UNIVERSITY LIBRARY - MY BOOKS PAGE (my-books.html)
     ============================================================================
     
     This page shows a user's borrowed books (loans) and purchased books.
     Only visible when logged in.
     
     PAGE STRUCTURE:
     1. Navbar (rendered by app.js)
     2. Two sections: Active Loans and My Purchases
     3. Glassmorphism cards for each book
     ============================================================================ -->

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Books | University Library</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../css/styles.css">
</head>

<body
    class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 min-h-screen flex flex-col transition-colors duration-300">

    <!-- Navbar -->
    <div id="navbar-placeholder"></div>

    <!-- Main Content -->
    <main class="flex-1 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10 w-full pt-20">

        <!-- Page Header -->
        <div class="mb-8">
            <h1 class="text-3xl font-bold text-slate-900 dark:text-white tracking-tight">My Library</h1>
            <p class="text-sm text-slate-500 dark:text-slate-400 font-medium mt-1">Manage your borrowed and purchased
                books.</p>
        </div>

        <!-- =========================================================================
             ACTIVE LOANS SECTION
             Shows books the user has borrowed.
             ========================================================================= -->

        <section class="mb-10">
            <h2 class="text-xl font-bold text-slate-900 dark:text-white mb-4 flex items-center gap-2">
                <span class="w-1 h-6 bg-blue-600 rounded-full"></span>
                Active Loans
            </h2>

            <div id="loan-grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-4">
                <!-- Loans are injected here by main.js -->
            </div>
        </section>

        <!-- =========================================================================
             MY PURCHASES SECTION
             Shows books the user has purchased.
             ========================================================================= -->

        <section>
            <h2 class="text-xl font-bold text-slate-900 dark:text-white mb-4 flex items-center gap-2">
                <span class="w-1 h-6 bg-emerald-600 rounded-full"></span>
                My Purchases
            </h2>

            <div id="purchase-grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-4">
                <!-- Purchases are injected here by main.js -->
            </div>
        </section>

    </main>

    <!-- Footer -->
    <footer
        class="mt-auto py-8 text-center text-slate-500 dark:text-slate-400 border-t border-slate-200/50 dark:border-slate-800/50 backdrop-blur-sm">
        <p class="text-xs font-medium">University Library System &copy; 2026</p>
    </footer>

    <!-- Scripts -->
    <script src="../js/app.js"></script>
    <script src="../js/main.js"></script>

</body>

</html>
