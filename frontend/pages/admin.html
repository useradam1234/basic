<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administration | University Library</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../css/styles.css">
</head>

<body
    class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 min-h-screen flex flex-col transition-colors duration-300">

    <!-- Navbar Placeholder -->

    <!-- Navbar Placeholder -->
    <div id="navbar-placeholder"></div>

    <main class="flex-1 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10 w-full">

        <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 gap-4">
            <div>
                <h1 class="text-3xl font-bold text-slate-900 dark:text-white tracking-tight">Dashboard Overview</h1>
                <p class="text-sm text-slate-500 dark:text-slate-400 font-medium">Control center for library assets and
                    circulation.</p>
            </div>

            <div class="glass-card p-1 rounded-xl flex gap-1">
                <button onclick="switchTab('books')" id="books-tab-btn"
                    class="tab-btn px-4 py-2 text-xs font-bold uppercase tracking-wider rounded-lg bg-slate-900 text-white shadow-sm transition-all text-white">Books</button>
                <button onclick="switchTab('loans')" id="loans-tab-btn"
                    class="tab-btn px-4 py-2 text-xs font-bold uppercase tracking-wider rounded-lg text-slate-500 hover:text-slate-900 dark:text-slate-400 dark:hover:text-white transition-all">Circulation</button>
                <button onclick="switchTab('users')" id="users-tab-btn"
                    class="tab-btn px-4 py-2 text-xs font-bold uppercase tracking-wider rounded-lg text-slate-500 hover:text-slate-900 dark:text-slate-400 dark:hover:text-white transition-all">Users</button>
            </div>
        </div>

        <!-- Books Tab -->
        <div id="books-tab" class="admin-tab space-y-4 animate-fade-in">
            <div class="flex justify-end">
                <button onclick="openAddModal()"
                    class="px-5 py-2.5 bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold uppercase tracking-wide rounded-xl shadow-lg shadow-blue-600/20 transition-all flex items-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                    </svg>
                    <span>Add New Book</span>
                </button>
                <button onclick="openGenreModal()"
                    class="px-5 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold uppercase tracking-wide rounded-xl shadow-lg shadow-indigo-600/20 transition-all flex items-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z">
                        </path>
                    </svg>
                    <span>Manage Genres</span>
                </button>
            </div>
            <div class="glass-card rounded-2xl overflow-hidden border border-slate-200 dark:border-slate-800">
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-sm">
                        <thead
                            class="bg-slate-50/50 dark:bg-slate-900/50 border-b border-slate-200 dark:border-slate-700">
                            <tr>
                                <th
                                    class="px-6 py-4 font-semibold text-slate-900 dark:text-white uppercase text-xs tracking-wider">
                                    Cover</th>
                                <th
                                    class="px-6 py-4 font-semibold text-slate-900 dark:text-white uppercase text-xs tracking-wider">
                                    Title / ISBN</th>
                                <th
                                    class="px-6 py-4 font-semibold text-slate-900 dark:text-white uppercase text-xs tracking-wider">
                                    Author</th>
                                <th
                                    class="px-6 py-4 font-semibold text-slate-900 dark:text-white uppercase text-xs tracking-wider">
                                    Genre</th>
                                <th
                                    class="px-6 py-4 font-semibold text-slate-900 dark:text-white uppercase text-xs tracking-wider">
                                    Inventory</th>
                                <th
                                    class="px-6 py-4 font-semibold text-right text-slate-900 dark:text-white uppercase text-xs tracking-wider">
                                    Actions</th>
                            </tr>
                        </thead>
                        <tbody id="books-table-body"
                            class="divide-y divide-slate-100 dark:divide-slate-800 bg-white/40 dark:bg-slate-900/40">
                            <!-- Items Injected Here -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Loans Tab -->
        <div id="loans-tab" class="admin-tab hidden animate-fade-in">
            <div class="glass-card rounded-2xl overflow-hidden border border-slate-200 dark:border-slate-800">
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-sm">
                        <thead
                            class="bg-slate-50/50 dark:bg-slate-900/50 border-b border-slate-200 dark:border-slate-700">
                            <tr>
                                <th
                                    class="px-6 py-4 font-semibold text-slate-900 dark:text-white uppercase text-xs tracking-wider">
                                    Borrower</th>
                                <th
                                    class="px-6 py-4 font-semibold text-slate-900 dark:text-white uppercase text-xs tracking-wider">
                                    Book Title</th>
                                <th
                                    class="px-6 py-4 font-semibold text-slate-900 dark:text-white uppercase text-xs tracking-wider">
                                    Due Date</th>
                                <th
                                    class="px-6 py-4 font-semibold text-slate-900 dark:text-white uppercase text-xs tracking-wider">
                                    Status</th>
                            </tr>
                        </thead>
                        <tbody id="loans-table-body"
                            class="divide-y divide-slate-100 dark:divide-slate-800 bg-white/40 dark:bg-slate-900/40">
                            <!-- Loan Items Injected Here -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>



        <!-- Users Tab -->
        <div id="users-tab" class="admin-tab hidden animate-fade-in">
            <div class="glass-card rounded-2xl overflow-hidden border border-slate-200 dark:border-slate-800">
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-sm">
                        <thead
                            class="bg-slate-50/50 dark:bg-slate-900/50 border-b border-slate-200 dark:border-slate-700">
                            <tr>
                                <th
                                    class="px-6 py-4 font-semibold text-slate-900 dark:text-white uppercase text-xs tracking-wider">
                                    User</th>
                                <th
                                    class="px-6 py-4 font-semibold text-slate-900 dark:text-white uppercase text-xs tracking-wider">
                                    Role</th>
                                <th
                                    class="px-6 py-4 font-semibold text-slate-900 dark:text-white uppercase text-xs tracking-wider">
                                    Balance</th>
                                <th
                                    class="px-6 py-4 font-semibold text-right text-slate-900 dark:text-white uppercase text-xs tracking-wider">
                                    Active Loans</th>
                                <th
                                    class="px-6 py-4 font-semibold text-right text-slate-900 dark:text-white uppercase text-xs tracking-wider">
                                    Actions</th>
                            </tr>
                        </thead>
                        <tbody id="users-table-body"
                            class="divide-y divide-slate-100 dark:divide-slate-800 bg-white/40 dark:bg-slate-900/40">
                            <!-- User Items Injected Here -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </main>



    <!-- Genre Manager Modal -->
    <div id="genre-modal" class="fixed inset-0 z-[60] hidden">
        <div class="absolute inset-0 bg-slate-900/60 backdrop-blur-sm transition-opacity" onclick="closeGenreModal()">
        </div>
        <div
            class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-full max-w-sm glass-card bg-white/95 dark:bg-slate-900/95 rounded-2xl shadow-2xl p-6 border border-white/20">
            <h2 class="text-xl font-bold mb-6 text-slate-900 dark:text-white flex items-center gap-2">
                <span class="w-1 h-6 bg-indigo-600 rounded-full"></span>
                Manage Genres
            </h2>

            <div class="flex gap-2 mb-4">
                <input type="text" id="new-genre-name" placeholder="New genre name..."
                    class="flex-1 px-3 py-2 bg-slate-50 dark:bg-slate-800 border-none rounded-lg text-sm font-medium focus:ring-2 focus:ring-indigo-500">
                <button onclick="addNewGenre()"
                    class="px-3 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg transition-colors">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                    </svg>
                </button>
            </div>

            <div id="genre-list" class="space-y-2 max-h-[50vh] overflow-y-auto pr-2">
                <!-- Genres injected here -->
            </div>

            <div class="flex justify-end pt-6 border-t border-slate-100 dark:border-slate-800 mt-6">
                <button onclick="closeGenreModal()"
                    class="px-4 py-2 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-900 dark:text-white text-xs font-bold uppercase tracking-wider rounded-lg transition-colors">Close</button>
            </div>
        </div>
    </div>

    <!-- Modal for Edit/Add (Hidden by default) -->
    <div id="book-modal" class="fixed inset-0 z-[60] hidden">
        <div class="absolute inset-0 bg-slate-900/60 backdrop-blur-sm transition-opacity" onclick="closeModal()"></div>
        <div
            class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-full max-w-lg glass-card bg-white/95 dark:bg-slate-900/95 rounded-2xl shadow-2xl p-8 border border-white/20">
            <h2 class="text-xl font-bold mb-6 text-slate-900 dark:text-white flex items-center gap-2" id="modal-title">
                <span class="w-1 h-6 bg-blue-600 rounded-full"></span>
                Edit Book Configuration
            </h2>
            <form id="book-form" class="space-y-4">
                <input type="hidden" id="book-id">
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label
                            class="block text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-1.5">Title</label>
                        <input type="text" id="title"
                            class="w-full px-3 py-2.5 bg-slate-50 dark:bg-slate-800 border-none rounded-xl text-sm font-medium focus:ring-2 focus:ring-blue-500"
                            required>
                    </div>
                    <div>
                        <label
                            class="block text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-1.5">Author</label>
                        <input type="text" id="author"
                            class="w-full px-3 py-2.5 bg-slate-50 dark:bg-slate-800 border-none rounded-xl text-sm font-medium focus:ring-2 focus:ring-blue-500"
                            required>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label
                            class="block text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-1.5">Genre</label>
                        <select id="genre"
                            class="w-full px-3 py-2.5 bg-slate-50 dark:bg-slate-800 border-none rounded-xl text-sm font-medium focus:ring-2 focus:ring-blue-500"
                            required>
                            <option value="" disabled selected>Select a genre</option>
                        </select>

                    </div>
                    <div>
                        <label
                            class="block text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-1.5">Year</label>
                        <input type="number" id="year"
                            class="w-full px-3 py-2.5 bg-slate-50 dark:bg-slate-800 border-none rounded-xl text-sm font-medium focus:ring-2 focus:ring-blue-500"
                            required>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label
                            class="block text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-1.5">ISBN</label>
                        <input type="text" id="isbn"
                            class="w-full px-3 py-2.5 bg-slate-50 dark:bg-slate-800 border-none rounded-xl text-sm font-medium focus:ring-2 focus:ring-blue-500"
                            required>
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-1.5">Total
                            Copies</label>
                        <input type="number" id="total_copies"
                            class="w-full px-3 py-2.5 bg-slate-50 dark:bg-slate-800 border-none rounded-xl text-sm font-medium focus:ring-2 focus:ring-blue-500"
                            required>
                    </div>
                </div>

                <div>
                    <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-1.5">Price
                        (DZD)</label>
                    <input type="number" step="0.01" id="price"
                        class="w-full px-3 py-2.5 bg-slate-50 dark:bg-slate-800 border-none rounded-xl text-sm font-medium focus:ring-2 focus:ring-blue-500"
                        required>
                </div>

                <div>
                    <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-1.5">Cover
                        URL</label>
                    <input type="url" id="cover_url"
                        class="w-full px-3 py-2.5 bg-slate-50 dark:bg-slate-800 border-none rounded-xl text-sm font-medium focus:ring-2 focus:ring-blue-500">
                </div>

                <div>
                    <label
                        class="block text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-1.5">Description</label>
                    <textarea id="description" rows="3"
                        class="w-full px-3 py-2.5 bg-slate-50 dark:bg-slate-800 border-none rounded-xl text-sm font-medium focus:ring-2 focus:ring-blue-500"></textarea>
                </div>

                <div class="flex justify-end gap-3 pt-4">
                    <button type="button" onclick="closeModal()"
                        class="px-4 py-2 text-xs font-bold uppercase tracking-wider text-slate-500 hover:text-slate-900 dark:hover:text-white transition-colors">Cancel</button>
                    <button type="submit"
                        class="px-6 py-2 bg-slate-900 dark:bg-white text-white dark:text-slate-900 text-xs font-bold uppercase tracking-wider rounded-xl hover:opacity-90 transition-opacity">Save
                        Asset</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal for User Details (Hidden by default) -->
    <div id="user-modal" class="fixed inset-0 z-[60] hidden">
        <div class="absolute inset-0 bg-slate-900/60 backdrop-blur-sm transition-opacity" onclick="closeUserModal()">
        </div>
        <div
            class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-full max-w-lg glass-card bg-white/95 dark:bg-slate-900/95 rounded-2xl shadow-2xl p-8 border border-white/20">
            <h2 class="text-xl font-bold mb-6 text-slate-900 dark:text-white flex items-center gap-2">
                <span class="w-1 h-6 bg-indigo-600 rounded-full"></span>
                Active Loans
            </h2>
            <div id="user-loans-list" class="space-y-4 max-h-[60vh] overflow-y-auto pr-2">
                <!-- Loans injected here -->
                <div class="text-center py-8 text-slate-500">Loading loans...</div>
            </div>
            <div class="flex justify-end pt-6 border-t border-slate-100 dark:border-slate-800 mt-6">
                <button onclick="closeUserModal()"
                    class="px-4 py-2 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-900 dark:text-white text-xs font-bold uppercase tracking-wider rounded-lg transition-colors">Close</button>
            </div>
        </div>
    </div>

    <script src="../js/app.js"></script>
    <script src="../js/admin.js"></script>
</body>

</html>
