<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../css/styles.css">
</head>

<body
    class="bg-slate-50 dark:bg-slate-950 min-h-screen text-slate-900 dark:text-slate-100 transition-colors duration-300 flex items-center justify-center p-4">

    <!-- Navbar Container (Hidden or Minimal) -->

    <!-- Navbar Container (Hidden or Minimal) -->
    <div id="navbar-placeholder" class="fixed top-0 left-0 w-full z-50"></div>

    <main class="w-full max-w-md animate-fade-in pt-16">

        <!-- Unified Glass Sheet -->
        <div
            class="glass-card rounded-3xl overflow-hidden shadow-2xl border border-white/20 dark:border-white/10 backdrop-blur-xl">

            <!-- 1. Header & Identity -->
            <div class="p-8 text-center bg-white/40 dark:bg-slate-900/40">
                <div
                    class="w-20 h-20 mx-auto rounded-full bg-slate-900 dark:bg-white text-white dark:text-slate-900 flex items-center justify-center text-3xl font-bold mb-3 shadow-lg">
                    <span id="user-initials"></span>
                </div>
                <h2 class="text-xl font-bold" id="display-name">Loading...</h2>
                <div class="flex items-center justify-center gap-2 mt-2">
                    <span class="text-xs font-bold text-slate-500 uppercase tracking-wider"
                        id="display-role">STUDENT</span>
                    <span class="text-slate-300 dark:text-slate-600">•</span>
                    <span class="text-emerald-600 dark:text-emerald-400 font-bold" id="display-balance">0 DZD</span>
                    <button onclick="openBalanceModal()"
                        class="text-[10px] bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 px-2 py-0.5 rounded font-bold hover:bg-emerald-500/20 transition-colors">
                        EDIT
                    </button>
                </div>
            </div>

            <!-- 2. Profile Form -->
            <div class="p-6 border-t border-slate-100 dark:border-slate-800/50">
                <form id="profile-form" class="space-y-4">
                    <div class="space-y-1">
                        <label class="text-[10px] font-bold text-slate-400 uppercase tracking-widest pl-1">Display
                            Name</label>
                        <input type="text" id="full-name"
                            class="w-full px-0 py-2 bg-transparent border-b-2 border-slate-100 dark:border-slate-800 focus:border-blue-500 text-sm font-medium outline-none transition-colors"
                            placeholder="Your Name" required>
                    </div>
                    <div class="space-y-1">
                        <label class="text-[10px] font-bold text-slate-400 uppercase tracking-widest pl-1">Email
                            Address</label>
                        <input type="email" id="email"
                            class="w-full px-0 py-2 bg-transparent border-b-2 border-slate-100 dark:border-slate-800 focus:border-blue-500 text-sm font-medium outline-none transition-colors"
                            placeholder="email@example.com" required>
                    </div>
                    <div class="pt-2">
                        <button type="submit"
                            class="text-xs font-bold text-blue-600 hover:text-blue-700 dark:text-blue-400 transition-colors">
                            Save Profile Changes
                        </button>
                    </div>
                </form>
            </div>

            <!-- 3. Security Form -->
            <div class="p-6 border-t border-slate-100 dark:border-slate-800/50 bg-slate-50/50 dark:bg-slate-900/30">
                <form id="password-form" class="space-y-4">
                    <h3 class="text-xs font-bold text-slate-900 dark:text-slate-100 uppercase tracking-wider mb-2">
                        Change Password</h3>
                    <input type="password" id="current-password"
                        class="w-full px-4 py-3 bg-white dark:bg-slate-900 border border-slate-100 dark:border-slate-800 rounded-xl text-sm"
                        placeholder="Current Password" required>
                    <div class="grid grid-cols-2 gap-2">
                        <input type="password" id="new-password"
                            class="w-full px-4 py-3 bg-white dark:bg-slate-900 border border-slate-100 dark:border-slate-800 rounded-xl text-sm"
                            placeholder="New Password" required>
                        <input type="password" id="confirm-password"
                            class="w-full px-4 py-3 bg-white dark:bg-slate-900 border border-slate-100 dark:border-slate-800 rounded-xl text-sm"
                            placeholder="Confirm" required>
                    </div>
                    <button type="submit"
                        class="w-full py-2 bg-slate-200 dark:bg-slate-800 text-slate-600 dark:text-slate-400 text-xs font-bold rounded-lg hover:bg-slate-300 dark:hover:bg-slate-700 transition-colors">
                        Update Password
                    </button>
                </form>
            </div>

            <!-- 4. Footer Actions -->
            <div
                class="p-4 border-t border-slate-100 dark:border-slate-800/50 flex items-center justify-between text-xs font-bold">
                <button onclick="theme.toggle()"
                    class="px-4 py-2 text-slate-500 hover:text-slate-800 dark:hover:text-slate-200 transition-colors flex items-center gap-2">
                    <span id="theme-icon-text">Dark Mode</span>
                </button>

                <div class="flex gap-2">
                    <a href="admin.html" id="admin-panel-link"
                        class="hidden px-4 py-2 text-indigo-600 hover:bg-indigo-50 dark:hover:bg-indigo-900/20 rounded-lg transition-colors">
                        Admin
                    </a>
                    <button onclick="logout()"
                        class="px-4 py-2 text-red-500 hover:bg-red-50 dark:hover:bg-red-900/20 rounded-lg transition-colors">
                        Sign Out
                    </button>
                </div>
            </div>

        </div>

    </main>

    <!-- Balance Modal -->
    <div id="balance-modal" class="fixed inset-0 z-50 hidden modal-backdrop-blur">
        <div class="absolute inset-0 bg-slate-900/20" onclick="closeBalanceModal()"></div>
        <div class="flex min-h-screen items-center justify-center p-4">
            <div class="bg-white dark:bg-slate-900 rounded-2xl p-6 shadow-2xl animate-fade-in w-64 text-center">
                <input type="number" id="fund-amount" step="0.01" min="1"
                    class="w-full text-center text-3xl font-black bg-transparent border-none outline-none mb-4 focus:ring-0"
                    placeholder="0 DZD" autoFocus>
                <div class="flex gap-2 justify-center">
                    <button onclick="closeBalanceModal()"
                        class="px-4 py-2 bg-slate-100 dark:bg-slate-800 rounded-lg text-xs font-bold text-slate-500">Cancel</button>
                    <button onclick="submitBalance()"
                        class="px-4 py-2 bg-emerald-500 text-white rounded-lg text-xs font-bold shadow-lg shadow-emerald-500/30">Update
                        Balance</button>
                </div>
            </div>
        </div>
    </div>

    <script src="../js/app.js"></script>
    <script src="../js/main.js"></script>
</body>

</html>
