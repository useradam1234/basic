<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | University Library</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../css/styles.css">
</head>

<body class="bg-slate-50 dark:bg-slate-950 min-h-screen flex items-center justify-center p-4">

    <div
        class="w-full max-w-4xl bg-white dark:bg-slate-900 rounded-2xl shadow-xl overflow-hidden flex flex-col md:flex-row border border-slate-200 dark:border-slate-800">

        <!-- Left Panel: Branding -->
        <div
            class="w-full md:w-1/2 p-12 bg-slate-900 text-white flex flex-col justify-between relative overflow-hidden">
            <div class="relative z-10">
                <div class="w-10 h-10 bg-white/10 backdrop-blur rounded-lg flex items-center justify-center mb-6">
                    <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253">
                        </path>
                    </svg>
                </div>
                <h2 class="text-3xl font-bold tracking-tight mb-2">University Library</h2>
                <p class="text-slate-400">Your gateway to academic excellence and research resources.</p>
            </div>

            <div class="relative z-10 text-xs text-slate-500 mt-12">
                &copy; 2026 Academic Systems. secure access only.
            </div>

            <!-- Abstract Decor -->
            <div class="absolute top-0 right-0 -mr-20 -mt-20 w-80 h-80 bg-blue-500/20 blur-3xl rounded-full"></div>
            <div class="absolute bottom-0 left-0 -ml-20 -mb-20 w-80 h-80 bg-indigo-500/20 blur-3xl rounded-full"></div>
        </div>

        <!-- Right Panel: Forms -->
        <div class="w-full md:w-1/2 p-12 relative">
            <div class="absolute top-4 right-4">
                <button onclick="theme.toggle()"
                    class="p-2 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 transition-colors">
                    <svg id="theme-icon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"></svg>
                </button>
            </div>

            <div id="login-container" class="animate-fade-in">
                <div class="mb-8">
                    <h3 class="text-2xl font-bold text-slate-900 dark:text-white mb-1" id="auth-title">Welcome Back</h3>
                    <p class="text-sm text-slate-500 dark:text-slate-400" id="auth-subtitle">Please enter your
                        credentials to access your account.</p>
                </div>

                <form id="login-form" class="space-y-5">
                    <div>
                        <label
                            class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2">Username</label>
                        <input type="text" id="username"
                            class="w-full px-4 py-3 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg text-sm focus:ring-2 focus:ring-slate-900 dark:focus:ring-white focus:outline-none transition-all"
                            placeholder="Enter your username" required>
                    </div>
                    <div>
                        <label
                            class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2">Password</label>
                        <input type="password" id="password"
                            class="w-full px-4 py-3 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg text-sm focus:ring-2 focus:ring-slate-900 dark:focus:ring-white focus:outline-none transition-all"
                            placeholder="Enter your password" required>
                    </div>
                    <button type="submit"
                        class="w-full py-3 bg-slate-900 dark:bg-white text-white dark:text-slate-900 font-semibold rounded-lg hover:bg-slate-800 dark:hover:bg-slate-200 transition-colors shadow-lg shadow-slate-900/10">Sign
                        In</button>
                </form>

                <div class="mt-6 text-center">
                    <p class="text-sm text-slate-500">Don't have an account? <button onclick="toggleAuth('signup')"
                            class="text-slate-900 dark:text-white font-medium hover:underline">Register now</button></p>
                </div>
            </div>

            <div id="signup-container" class="hidden animate-fade-in">
                <div class="mb-8">
                    <h3 class="text-2xl font-bold text-slate-900 dark:text-white mb-1">Create Account</h3>
                    <p class="text-sm text-slate-500 dark:text-slate-400">Join the academic community.</p>
                </div>

                <form id="signup-form" class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2">Full
                            Name</label>
                        <input type="text" id="reg-fullname"
                            class="w-full px-4 py-3 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg text-sm focus:ring-2 focus:ring-slate-900 dark:focus:ring-white focus:outline-none transition-all"
                            placeholder="John Doe" required>
                    </div>
                    <div>
                        <label
                            class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2">Email</label>
                        <input type="email" id="reg-email"
                            class="w-full px-4 py-3 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg text-sm focus:ring-2 focus:ring-slate-900 dark:focus:ring-white focus:outline-none transition-all"
                            placeholder="john@university.edu" required>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label
                                class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2">Username</label>
                            <input type="text" id="reg-username"
                                class="w-full px-4 py-3 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg text-sm focus:ring-2 focus:ring-slate-900 dark:focus:ring-white focus:outline-none transition-all"
                                placeholder="jdoe" required>
                        </div>
                        <div>
                            <label
                                class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2">Password</label>
                            <input type="password" id="reg-password"
                                class="w-full px-4 py-3 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg text-sm focus:ring-2 focus:ring-slate-900 dark:focus:ring-white focus:outline-none transition-all"
                                placeholder="••••••••" required>
                        </div>
                    </div>

                    <button type="submit"
                        class="w-full py-3 bg-slate-900 dark:bg-white text-white dark:text-slate-900 font-semibold rounded-lg hover:bg-slate-800 dark:hover:bg-slate-200 transition-colors shadow-lg shadow-slate-900/10">Create
                        Account</button>
                </form>

                <div class="mt-6 text-center">
                    <p class="text-sm text-slate-500">Already have an account? <button onclick="toggleAuth('login')"
                            class="text-slate-900 dark:text-white font-medium hover:underline">Sign in</button></p>
                </div>
            </div>

        </div>
    </div>

    <script src="../js/app.js"></script>
    <script src="../js/main.js"></script>
</body>

</html>
